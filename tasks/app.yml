---
- name: app | Validate required variables
  ansible.builtin.assert:
    that:
      - app_src is defined and app_src | length > 0
      - app_name is match('^[a-z0-9][a-z0-9._-]*$')
    fail_msg: >-
      'app_src' must be set and 'app_name' must match ^[a-z0-9][a-z0-9._-]*$
      (got app_name={{ app_name | default('<unset>') }}).
  tags:
    - app

- name: "app | Create {{ app_name }} group"
  ansible.builtin.group:
    state: present
    gid: "{{ app_gid }}"
    name: "{{ app_group }}"
    non_unique: "{{ app_group_overwrite }}"
  tags:
    - app
    - app-user

- name: "app | Create {{ app_name }} user"
  ansible.builtin.user:
    state: present
    uid: "{{ app_uid }}"
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    groups: docker
    append: true
    create_home: "{{ not app_home_decouple }}"
    home: "{{ app_home }}"
    shell: "{{ app_user_shell }}"
    password: "*"
    non_unique: "{{ app_user_overwrite }}"
  tags:
    - app
    - app-user

- name: "app | Create {{ app_home }}"
  ansible.builtin.file:
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    dest: "{{ app_home }}"
    mode: "0750"
  when: app_home_decouple | default(true) | bool
  tags:
    - app
    - app-user

- name: "app | Ensure {{ app_dest }}"
  ansible.builtin.file:
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    dest: "{{ app_dest }}"
    mode: "0750"
  tags:
    - app
    - app-user

- name: "app | Install {{ app_name }} to {{ app_dest }}"
  ansible.builtin.copy:
    src: "{{ app_src }}"
    dest: "{{ app_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  notify:
    - Restart app
  tags:
    - app
    - app-install

- name: "app | Install {{ app_name }} service"
  ansible.builtin.template:
    src: docker-app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart app
  tags:
    - app
    - app-service

- name: app | Flush handlers before starting service
  ansible.builtin.meta: flush_handlers
  tags:
    - app
    - app-service

- name: "app | Manage {{ app_name }} service"
  ansible.builtin.service:
    name: "{{ app_name }}.service"
    state: "{{ 'started' if app_started | bool else 'stopped' }}"
    enabled: "{{ app_enabled | bool }}"
  when: app_started | bool or app_enabled | bool
  tags:
    - app
    - app-service
