---
role_name_check: 1

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
    role-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml

driver:
  name: docker

## The scenario starts real containers, not just the docker packages, so the
## inner daemon's storage has to be on a real filesystem. Left on the
## container's own overlayfs, containerd fails every image mount with
## "fstype: overlay ... invalid argument" - overlay cannot stack on overlay.
## Anonymous volumes for /var/lib/docker and /var/lib/containerd give it ext4.
platforms:
  - name: docker-app-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
    command: /lib/systemd/systemd
  - name: docker-app-debian-13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
      - /var/lib/containerd
    command: /lib/systemd/systemd

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${HOME}/.ansible/roles"
  config_options:
    defaults:
      stdout_callback: default
      result_format: yaml
      inject_facts_as_vars: false

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
